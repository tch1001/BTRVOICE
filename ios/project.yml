name: BtrVoice

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R4JXK6ZVPU
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  BtrVoice:
    type: application
    platform: iOS
    sources:
      - path: BtrVoiceApp
        excludes:
          - Info.plist
          - BtrVoice.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanchienhao.BtrVoice
        PRODUCT_NAME: Better Voice
        INFOPLIST_FILE: BtrVoiceApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: BtrVoiceApp/BtrVoice.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BtrVoiceKeyboard
        embed: true

  BtrVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: BtrVoiceKeyboard
        excludes:
          - Info.plist
          - BtrVoiceKeyboard.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanchienhao.BtrVoice.Keyboard
        PRODUCT_NAME: Better Voice Keyboard
        INFOPLIST_FILE: BtrVoiceKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: BtrVoiceKeyboard/BtrVoiceKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  BtrVoice:
    build:
      targets:
        BtrVoice: all
        BtrVoiceKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
