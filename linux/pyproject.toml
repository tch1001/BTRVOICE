[project]
name = "btrvoice-linux"
version = "0.1.0"
description = "BtrVoice for Linux/X11 — dictate into any app via synthetic key events"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "faster-whisper>=1.1",
    "webrtcvad-wheels>=2.0",
    "numpy",
    "scipy",
    "pynput>=1.7",
]

[project.scripts]
btrvoice = "btrvoice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btrvoice"]
